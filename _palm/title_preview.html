<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Space+Grotesk:wght@300..700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#0a0e1a;font-family:'Space Grotesk',sans-serif}
  .row{position:relative;height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;border-bottom:1px solid #1a2233}
  .row::before{content:'';position:absolute;left:50%;bottom:-70px;transform:translateX(-50%);width:600px;height:110px;background:radial-gradient(ellipse at 50% 35%, rgba(20,80,60,.55), rgba(10,25,20,.2) 70%, transparent);border-radius:50%}
  .tag{position:absolute;top:14px;left:18px;font:11px monospace;color:#5a6a7a;letter-spacing:.2em}
  h1{margin:0;font-size:120px;line-height:1;color:#eceae5;font-weight:700;position:relative}
  .cn{margin-top:14px;font-size:26px;color:#3df5a6;position:relative}
  /* A 渐变 */
  .grad{background:linear-gradient(180deg,#e0b869 15%,#3df5a6 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
  /* B 空心 */
  .stroke{color:transparent;-webkit-text-stroke:2.5px #eceae5}
  /* C 衬线混排 */
  .serif-i{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:128px;margin-right:18px}
  /* D O 标记 */
  .omark{display:inline-block;width:78px;height:78px;border:6px solid #e0b869;border-radius:50%;vertical-align:-6px;margin:0 4px;position:relative}
  .omark::after{content:'';position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:44px;height:16px;background:rgba(61,245,166,.75);border-radius:50%}
  /* E Fraunces */
  .fr{font-family:'Fraunces',serif;font-weight:340}
  .fr b{font-weight:860}
</style></head><body>
<div class="row"><span class="tag">A · 渐变流沙（现在的字体 + 沙金→绿洲绿渐变）</span><h1 class="grad">AI OASIS</h1><div class="cn">AI绿洲</div></div>
<div class="row"><span class="tag">B · 空心描边（AI 实心 + OASIS 描边）</span><h1>AI <span class="stroke">OASIS</span></h1><div class="cn">AI绿洲</div></div>
<div class="row"><span class="tag">C · 衬线混排（AI 用意大利衬线体 + OASIS 无衬线粗体）</span><h1><span class="serif-i">AI</span>OASIS</h1><div class="cn">AI绿洲</div></div>
<div class="row"><span class="tag">D · 字母 O 变绿洲标记（太阳 + 水潭）</span><h1>AI <span class="omark"></span>ASIS</h1><div class="cn">AI绿洲</div></div>
<div class="row"><span class="tag">E · Fraunces 衬线（AI 细体 + OASIS 特粗，杂志感）</span><h1 class="fr">AI <b>OASIS</b></h1><div class="cn">AI绿洲</div></div>
</body></html>
